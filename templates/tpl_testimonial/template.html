<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { font-family: 'Assistant', sans-serif; box-sizing: border-box; margin: 0; padding: 0; }

    .frame {
      width: 1080px;
      height: 1080px;
      position: relative;
      overflow: hidden;
      background: #f7f4ef;
    }

    /* BG image — subtle opacity */
    .bg-img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0.12;
      z-index: 0;
    }

    /* Warm overlay */
    .overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(247,244,239,0.92) 0%, rgba(240,234,224,0.88) 100%);
      z-index: 1;
    }

    /* Decorative corner shapes */
    .corner-tl {
      position: absolute;
      top: 0; right: 0;
      width: 280px; height: 280px;
      background: var(--brand);
      opacity: 0.07;
      border-radius: 0 0 0 100%;
      z-index: 1;
    }
    .corner-br {
      position: absolute;
      bottom: 0; left: 0;
      width: 220px; height: 220px;
      background: var(--brand);
      opacity: 0.07;
      border-radius: 0 100% 0 0;
      z-index: 1;
    }

    /* Phone mockup */
    .phone-wrap {
      position: absolute;
      top: -20px;
      left: -30px;
      width: 380px;
      height: 720px;
      z-index: 4;
    }
    .phone-shell {
      width: 100%;
      height: 100%;
      border-radius: 48px;
      background: #1a1a1a;
      box-shadow:
        0 40px 80px rgba(0,0,0,0.35),
        0 8px 24px rgba(0,0,0,0.20),
        inset 0 0 0 2px rgba(255,255,255,0.08);
      position: relative;
      overflow: hidden;
    }
    .phone-inner-img {
      position: absolute;
      inset: 10px;
      border-radius: 40px;
      overflow: hidden;
    }
    .phone-inner-img img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    /* Phone notch */
    .phone-notch {
      position: absolute;
      top: 18px;
      left: 50%;
      transform: translateX(-50%);
      width: 100px;
      height: 26px;
      background: #1a1a1a;
      border-radius: 0 0 20px 20px;
      z-index: 10;
    }
    /* Phone home bar */
    .phone-home {
      position: absolute;
      bottom: 14px;
      left: 50%;
      transform: translateX(-50%);
      width: 80px;
      height: 5px;
      background: rgba(255,255,255,0.3);
      border-radius: 3px;
      z-index: 10;
    }
    /* Phone button side */
    .phone-btn {
      position: absolute;
      right: -4px;
      top: 140px;
      width: 4px;
      height: 60px;
      background: #111;
      border-radius: 0 4px 4px 0;
    }

    /* Content area */
    .content {
      position: absolute;
      top: 80px;
      right: 80px;
      left: 380px;
      z-index: 5;
    }

    /* Logo + brand row */
    .brand-row {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 36px;
    }
    .logo-box {
      width: 52px;
      height: 52px;
      border-radius: 14px;
      background: #fff;
      box-shadow: 0 2px 12px rgba(0,0,0,0.10);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .logo-box img {
      max-width: 40px;
      max-height: 40px;
      object-fit: contain;
    }
    .brand-name {
      font-size: 18px;
      font-weight: 700;
      color: #3a2a1a;
      letter-spacing: 0.02em;
    }

    /* Headline */
    .headline-small {
      font-size: 20px;
      font-weight: 600;
      color: var(--brand);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 8px;
    }
    .headline-big {
      font-size: 64px;
      font-weight: 900;
      line-height: 1.0;
      color: #2a1a0e;
      letter-spacing: -0.02em;
      margin-bottom: 40px;
    }
    .headline-big em {
      font-style: italic;
      font-weight: 300;
      color: #5a3a20;
    }

    /* Review card */
    .review-card {
      background: #fff;
      border-radius: 24px;
      padding: 36px 40px;
      box-shadow: 0 12px 48px rgba(100,70,40,0.12), 0 2px 8px rgba(100,70,40,0.06);
      border: 1px solid rgba(200,180,150,0.2);
      position: relative;
    }

    /* Big quote mark */
    .big-quote {
      position: absolute;
      bottom: 24px;
      left: 32px;
      font-size: 120px;
      font-weight: 900;
      color: var(--brand);
      opacity: 0.12;
      line-height: 1;
      font-style: italic;
    }

    /* Stars */
    .stars {
      display: flex;
      gap: 6px;
      margin-bottom: 18px;
    }

    /* Review text */
    .review-text {
      font-size: 22px;
      font-weight: 400;
      color: #3a2a1a;
      line-height: 1.65;
      margin-bottom: 24px;
      position: relative;
      z-index: 1;
    }

    /* Reviewer info */
    .reviewer {
      display: flex;
      align-items: center;
      gap: 16px;
      padding-top: 20px;
      border-top: 1px solid rgba(200,180,150,0.25);
    }
    .avatar {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      font-weight: 800;
      color: #fff;
      flex-shrink: 0;
    }
    .reviewer-name {
      font-size: 18px;
      font-weight: 700;
      color: #2a1a0e;
    }
    .reviewer-sub {
      font-size: 14px;
      font-weight: 400;
      color: rgba(80,50,30,0.5);
      margin-top: 2px;
    }
    .verified-badge {
      margin-right: auto;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      font-weight: 600;
      color: var(--brand);
      background: rgba(0,0,0,0.04);
      padding: 6px 14px;
      border-radius: 20px;
    }

    /* Bottom */
    .bottom-strip {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 72px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 80px;
      z-index: 6;
      background: rgba(247,244,239,0.90);
      border-top: 1px solid rgba(200,180,150,0.20);
      backdrop-filter: blur(8px);
    }
    .website-tag {
      font-size: 15px;
      font-weight: 600;
      color: rgba(80,50,30,0.45);
      letter-spacing: 0.04em;
    }

    /* Crown deco badge */
    .crown-badge {
      position: absolute;
      bottom: 88px;
      left: 60px;
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 4px 16px rgba(0,0,0,0.12);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      z-index: 6;
    }
  </style>
</head>
<body style="background:#ccc; display:flex; align-items:center; justify-content:center; min-height:100vh;">

<div class="frame" style="--brand: {{brandColor}};">

  <!-- BG image -->
  <img class="bg-img" src="{{imageUrl}}" alt="" onerror="this.style.display='none'">
  <div class="overlay"></div>

  <!-- Corner deco -->
  <div class="corner-tl"></div>
  <div class="corner-br"></div>

  <!-- Phone mockup -->
  <div class="phone-wrap">
    <div class="phone-shell">
      <div class="phone-inner-img">
        <img src="{{imageUrl}}" alt="" onerror="this.style.background='linear-gradient(160deg,#c8b89a,#8a6a40)'">
      </div>
      <div class="phone-notch"></div>
      <div class="phone-home"></div>
    </div>
    <div class="phone-btn"></div>
  </div>

  <!-- Crown badge -->
  <div class="crown-badge">👑</div>

  <!-- Main content -->
  <div class="content">

    <!-- Brand row -->
    <div class="brand-row">
      <div class="logo-box">
        <img src="{{logoUrl}}" alt="logo" onerror="this.style.display='none'">
      </div>
      <div class="brand-name">AutoMarketer</div>
    </div>

    <!-- Headline -->
    <div class="headline-small">לקוחות מספרים</div>
    <div class="headline-big">
      <em>מה</em> הלקוחות<br>שלנו אומרים
    </div>

    <!-- Review card -->
    <div class="review-card">
      <div class="big-quote">"</div>

      <!-- Stars -->
      <div class="stars">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="{{brandColor}}"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
        <svg width="32" height="32" viewBox="0 0 24 24" fill="{{brandColor}}"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
        <svg width="32" height="32" viewBox="0 0 24 24" fill="{{brandColor}}"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
        <svg width="32" height="32" viewBox="0 0 24 24" fill="{{brandColor}}"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
        <svg width="32" height="32" viewBox="0 0 24 24" fill="{{brandColor}}"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
      </div>

      <!-- Review text -->
      <div class="review-text">{{hook}}</div>

      <!-- Reviewer -->
      <div class="reviewer">
        <div class="avatar" style="background: {{brandColor}};">ל</div>
        <div>
          <div class="reviewer-name">לקוח/ה מרוצה</div>
          <div class="reviewer-sub">לקוח מאומת ✓</div>
        </div>
        <div class="verified-badge">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
          ביקורת מאומתת
        </div>
      </div>
    </div>

  </div>

  <!-- Bottom strip -->
  <div class="bottom-strip">
    <div class="website-tag">www.automarketer.co.il</div>
    <div style="height:36px; display:flex; align-items:center;">
      <img src="{{logoUrl}}" style="max-height:36px; max-width:120px; object-fit:contain; opacity:0.6;" alt="" onerror="this.style.display='none'">
    </div>
  </div>

</div>
</body>
</html>
