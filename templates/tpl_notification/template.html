<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { font-family: 'Assistant', sans-serif; box-sizing: border-box; margin: 0; padding: 0; }

    .frame {
      width: 1080px;
      height: 1080px;
      position: relative;
      overflow: hidden;
      background: #1a1a2e;
    }

    /* Background image */
    .bg-img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 0;
    }

    /* Dark gradient overlay — heavier at bottom for readability */
    .overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        180deg,
        rgba(0,0,0,0.10) 0%,
        rgba(0,0,0,0.20) 35%,
        rgba(0,0,0,0.55) 65%,
        rgba(0,0,0,0.72) 100%
      );
      z-index: 1;
    }

    /* Smartphone frame (inner border radius) */
    .phone-frame {
      position: absolute;
      inset: 30px;
      border-radius: 60px;
      border: 2px solid rgba(255,255,255,0.08);
      z-index: 2;
      pointer-events: none;
    }

    /* Status bar */
    .status-bar {
      position: absolute;
      top: 68px;
      left: 0; right: 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 96px;
      z-index: 5;
    }
    .status-time {
      font-size: 15px;
      font-weight: 600;
      color: rgba(255,255,255,0.85);
      letter-spacing: 0.05em;
    }
    .status-icons {
      display: flex;
      gap: 10px;
      align-items: center;
    }
    .status-icons svg {
      opacity: 0.85;
    }

    /* Lock time display */
    .lock-time {
      position: absolute;
      top: 160px;
      left: 0; right: 0;
      text-align: center;
      z-index: 5;
    }
    .lock-time .time-big {
      font-size: 130px;
      font-weight: 200;
      color: #fff;
      letter-spacing: -0.04em;
      line-height: 1;
      text-shadow: 0 2px 40px rgba(0,0,0,0.3);
    }
    .lock-time .date-str {
      font-size: 26px;
      font-weight: 400;
      color: rgba(255,255,255,0.82);
      margin-top: 12px;
      letter-spacing: 0.04em;
    }

    /* Notifications area */
    .notifs {
      position: absolute;
      bottom: 160px;
      left: 80px;
      right: 80px;
      z-index: 6;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Single notification card */
    .notif-card {
      background: rgba(255,255,255,0.14);
      backdrop-filter: blur(24px) saturate(180%);
      -webkit-backdrop-filter: blur(24px) saturate(180%);
      border-radius: 24px;
      border: 1px solid rgba(255,255,255,0.22);
      padding: 24px 32px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.25);
    }
    .notif-card.main {
      background: rgba(255,255,255,0.18);
      border: 1px solid rgba(255,255,255,0.30);
      padding: 32px 36px;
    }

    .notif-header {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 10px;
    }
    .notif-icon {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      flex-shrink: 0;
    }
    .notif-app {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.70);
    }
    .notif-time {
      margin-right: auto;
      font-size: 13px;
      font-weight: 400;
      color: rgba(255,255,255,0.45);
    }
    .notif-body {
      font-size: 22px;
      font-weight: 500;
      color: #fff;
      line-height: 1.5;
      text-shadow: 0 1px 6px rgba(0,0,0,0.2);
    }
    .notif-body.large {
      font-size: 26px;
      font-weight: 600;
    }

    /* Brand accent line */
    .accent-line {
      width: 40px;
      height: 3px;
      border-radius: 2px;
      margin-bottom: 16px;
    }

    /* Bottom controls */
    .bottom-controls {
      position: absolute;
      bottom: 56px;
      left: 0; right: 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 120px;
      z-index: 6;
    }
    .ctrl-btn {
      width: 76px;
      height: 76px;
      border-radius: 50%;
      background: rgba(255,255,255,0.15);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.25);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Logo */
    .logo-wrap {
      position: absolute;
      top: 68px;
      right: 80px;
      z-index: 7;
      height: 44px;
      display: flex;
      align-items: center;
    }
    .logo-wrap img {
      max-height: 44px;
      max-width: 140px;
      object-fit: contain;
      filter: brightness(0) invert(1);
      opacity: 0.85;
    }

    /* Close X badge */
    .close-badge {
      position: absolute;
      top: -12px;
      left: -12px;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: rgba(100,100,100,0.7);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      color: rgba(255,255,255,0.8);
      font-weight: 600;
    }
  </style>
</head>
<body style="background:#111; display:flex; align-items:center; justify-content:center; min-height:100vh;">

<div class="frame" style="--brand: {{brandColor}};">

  <!-- Background image -->
  <img class="bg-img" src="{{imageUrl}}" alt="" onerror="this.style.background='linear-gradient(160deg,#2c4a7a,#8b4513,#3d2010)'">

  <!-- Overlay -->
  <div class="overlay"></div>

  <!-- Phone frame border -->
  <div class="phone-frame"></div>

  <!-- Status bar -->
  <div class="status-bar">
    <div class="status-time">9:41</div>
    <div class="status-icons">
      <!-- Signal -->
      <svg width="18" height="14" viewBox="0 0 18 14" fill="white">
        <rect x="0" y="8" width="3" height="6" rx="1"/>
        <rect x="5" y="5" width="3" height="9" rx="1"/>
        <rect x="10" y="2" width="3" height="12" rx="1"/>
        <rect x="15" y="0" width="3" height="14" rx="1"/>
      </svg>
      <!-- WiFi -->
      <svg width="18" height="14" viewBox="0 0 18 14" fill="none">
        <path d="M9 11.5a1.5 1.5 0 100 3 1.5 1.5 0 000-3z" fill="white"/>
        <path d="M5.5 8.5C6.7 7.3 7.8 6.8 9 6.8s2.3.5 3.5 1.7" stroke="white" stroke-width="1.5" stroke-linecap="round" fill="none"/>
        <path d="M2.5 5.5C4.5 3.5 6.6 2.5 9 2.5s4.5 1 6.5 3" stroke="white" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.6"/>
      </svg>
      <!-- Battery -->
      <svg width="26" height="14" viewBox="0 0 26 14" fill="none">
        <rect x="0.5" y="0.5" width="21" height="13" rx="3.5" stroke="white" stroke-opacity="0.7"/>
        <rect x="2" y="2" width="16" height="10" rx="2" fill="white"/>
        <path d="M23 4.5v5a2 2 0 000-5z" fill="white" opacity="0.5"/>
      </svg>
    </div>
  </div>

  <!-- Logo -->
  <div class="logo-wrap">
    <img src="{{logoUrl}}" alt="logo" onerror="this.style.display='none'">
  </div>

  <!-- Lock time -->
  <div class="lock-time">
    <div class="time-big">11:11</div>
    <div class="date-str">יום ראשון, 11 בדצמבר</div>
  </div>

  <!-- Notification cards -->
  <div class="notifs">

    <!-- Main notification — hook text -->
    <div class="notif-card main" style="position:relative;">
      <div class="close-badge">✕</div>
      <div class="notif-header">
        <div class="notif-icon" style="background:{{brandColor}};">
          💡
        </div>
        <div class="notif-app">הודעה חשובה</div>
        <div class="notif-time">עכשיו</div>
      </div>
      <div class="accent-line" style="background:{{brandColor}};"></div>
      <div class="notif-body large">{{hook}}</div>
    </div>

    <!-- Secondary notification 1 -->
    <div class="notif-card">
      <div class="notif-header">
        <div class="notif-icon" style="background:rgba(255,255,255,0.2);">
          🔔
        </div>
        <div class="notif-app">תזכורת ידידותית</div>
        <div class="notif-time">לפני 5 דק'</div>
      </div>
      <div class="notif-body">אתם מוקפים באהבה. היקום לצידכם.</div>
    </div>

    <!-- Secondary notification 2 -->
    <div class="notif-card">
      <div class="notif-header">
        <div class="notif-icon" style="background:rgba(255,255,255,0.2);">
          📌
        </div>
        <div class="notif-app">אל תשכחו</div>
        <div class="notif-time">לפני 12 דק'</div>
      </div>
      <div class="notif-body">תאהבו את עצמכם. השלווה שלכם חשובה מכל.</div>
    </div>

  </div>

  <!-- Bottom controls -->
  <div class="bottom-controls">
    <!-- Flashlight -->
    <div class="ctrl-btn">
      <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
        <path d="M10 4h8l2 8H8L10 4z" stroke="white" stroke-width="1.8" stroke-linejoin="round"/>
        <path d="M8 12l2 12h8l2-12" stroke="white" stroke-width="1.8" stroke-linejoin="round"/>
        <line x1="14" y1="16" x2="14" y2="22" stroke="white" stroke-width="1.8" stroke-linecap="round"/>
      </svg>
    </div>
    <!-- Home indicator -->
    <div style="width:140px; height:6px; background:rgba(255,255,255,0.5); border-radius:3px;"></div>
    <!-- Camera -->
    <div class="ctrl-btn">
      <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
        <rect x="3" y="8" width="22" height="16" rx="3" stroke="white" stroke-width="1.8"/>
        <circle cx="14" cy="16" r="5" stroke="white" stroke-width="1.8"/>
        <circle cx="14" cy="16" r="2.5" fill="white" opacity="0.4"/>
        <path d="M10 8l1.5-3h5L18 8" stroke="white" stroke-width="1.8" stroke-linejoin="round"/>
      </svg>
    </div>
  </div>

</div>
</body>
</html>
